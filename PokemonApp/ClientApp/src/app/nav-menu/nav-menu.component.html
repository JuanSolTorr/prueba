<header class="sticky top-0 z-50 glass-panel border-b border-white/10 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo and Brand -->
      <div class="flex items-center">
        <a [routerLink]="['/']" (click)="collapse()" class="flex items-center gap-3 group">
          <!-- Custom CSS Pokéball Logo -->
          <div class="relative w-9 h-9 rounded-full border-2 border-pokeBlack bg-white overflow-hidden shadow-md group-hover:rotate-[360deg] transition-transform duration-700 ease-in-out">
            <!-- Top Half Red -->
            <div class="absolute top-0 left-0 w-full h-1/2 bg-pokeRed"></div>
            <!-- Middle Black Line -->
            <div class="absolute top-1/2 left-0 w-full h-1 bg-pokeBlack -translate-y-1/2"></div>
            <!-- Central Button -->
            <div class="absolute top-1/2 left-1/2 w-3.5 h-3.5 rounded-full border-2 border-pokeBlack bg-white -translate-x-1/2 -translate-y-1/2 flex items-center justify-center">
              <div class="w-1 h-1 rounded-full bg-pokeRed animate-pulse"></div>
            </div>
          </div>
          <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-pokeRed to-pokeYellow bg-clip-text text-transparent group-hover:drop-shadow-poke-glow transition-all duration-300">
            POKÉAPP
          </span>
        </a>
      </div>

      <!-- Desktop Nav Links -->
      <nav class="hidden md:flex items-center space-x-8">
        <a 
          [routerLink]="['/']" 
          [routerLinkActive]="['text-pokeRed', 'border-pokeRed']" 
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-sm font-semibold tracking-wide text-gray-300 hover:text-pokeRed px-3 py-2 border-b-2 border-transparent transition-all duration-200"
        >
          Inicio
        </a>
        <a 
          [routerLink]="['/pokemons']" 
          [routerLinkActive]="['text-pokeRed', 'border-pokeRed']"
          class="text-sm font-semibold tracking-wide text-gray-300 hover:text-pokeRed px-3 py-2 border-b-2 border-transparent transition-all duration-200"
        >
          Pokémon
        </a>
        <a 
          [routerLink]="['/items']" 
          [routerLinkActive]="['text-pokeRed', 'border-pokeRed']"
          class="text-sm font-semibold tracking-wide text-gray-300 hover:text-pokeRed px-3 py-2 border-b-2 border-transparent transition-all duration-200"
        >
          Objetos
        </a>
      </nav>

      <!-- Mobile Menu Button -->
      <div class="flex md:hidden">
        <button 
          (click)="toggle()" 
          type="button" 
          class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-white/10 focus:outline-none transition duration-150 ease-in-out"
          [attr.aria-expanded]="isExpanded"
        >
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!isExpanded" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="isExpanded" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Nav Links -->
  <div 
    [ngClass]="{'block animate-beam': isExpanded, 'hidden': !isExpanded}" 
    class="md:hidden glass-panel border-t border-white/5 px-2 pt-2 pb-3 space-y-1"
  >
    <a 
      [routerLink]="['/']" 
      [routerLinkActive]="['bg-pokeRed/10', 'text-pokeRed', 'border-l-4', 'border-pokeRed']" 
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="collapse()" 
      class="block px-3 py-2.5 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-white/5 transition duration-150"
    >
      Inicio
    </a>
    <a 
      [routerLink]="['/pokemons']" 
      [routerLinkActive]="['bg-pokeRed/10', 'text-pokeRed', 'border-l-4', 'border-pokeRed']"
      (click)="collapse()" 
      class="block px-3 py-2.5 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-white/5 transition duration-150"
    >
      Pokémon
    </a>
    <a 
      [routerLink]="['/items']" 
      [routerLinkActive]="['bg-pokeRed/10', 'text-pokeRed', 'border-l-4', 'border-pokeRed']"
      (click)="collapse()" 
      class="block px-3 py-2.5 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-white/5 transition duration-150"
    >
      Objetos
    </a>
  </div>
</header>
